<script>
const KEY='abuv_auto_crm_v1';
let db;
try{
  db=JSON.parse(localStorage.getItem(KEY)||'{"cars":[],"clients":[],"deals":[],"expenses":[]}');
}catch(e){
  db={cars:[],clients:[],deals:[],expenses:[]};
}
db.cars=Array.isArray(db.cars)?db.cars:[];
db.clients=Array.isArray(db.clients)?db.clients:[];
db.deals=Array.isArray(db.deals)?db.deals:[];
db.expenses=Array.isArray(db.expenses)?db.expenses:[];
db.cars.forEach(c=>{
  if(!Array.isArray(c.photos))c.photos=[];
  if(!Array.isArray(c.listings))c.listings=[];
  if(!Array.isArray(c.history))c.history=[];
});
let photos=[]; let editId=null;

// HUSTLE MOTORS v7.9 — Supabase is an optional cloud layer. Local CRM never waits for cloud.
const SUPABASE_URL='https://jpzoghmpfdhyzisjtpza.supabase.co';
const SUPABASE_KEY='sb_publishable_70e1x7fKJowSMUpp_vhcvQ_dHW8yvAj';
let hmCloudClient=null, cloudReady=false, cloudBusy=false;
const cloudStatusEl=()=>document.getElementById('cloudStatus');
function setCloudStatus(text,kind=''){const el=cloudStatusEl();if(!el)return;el.textContent=text;el.className='cloudStatus '+kind;}
function cloudInit(){
  try{
    if(!window['supabase']?.createClient) throw new Error('Supabase SDK не загрузился');
    hmCloudClient=window['supabase'].createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    cloudReady=true;
    setCloudStatus('☁️ Облако готово','ok');
    return true;
  }catch(e){console.error(e);cloudReady=false;setCloudStatus('☁️ Локальный режим','warn');return false;}
}
function withTimeout(promise,ms=8000){
  return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Таймаут подключения к Supabase')),ms))]);
}
async function cloudPing(){
  if(!cloudReady||!hmCloudClient)return false;
  try{
    const r=await withTimeout(hmCloudClient.from('cars').select('id',{head:true,count:'exact'}),8000);
    if(r.error)throw r.error;
    setCloudStatus(`☁️ Облако подключено · ${r.count||0} авто`,'ok');
    return true;
  }catch(e){console.error('cloudPing',e);setCloudStatus('☁️ Локальный режим · облако недоступно','warn');return false;}
}
function cloudErr(prefix,e){console.error(prefix,e);setCloudStatus('☁️ Ошибка облака','err');}
function localId(){return Date.now()+Math.floor(Math.random()*1000)}
async function cloudLoad(){
 if(!cloudReady||!hmCloudClient)return false;
 try{
  const [cr,er,cl,li,hi,cp]=await withTimeout(Promise.all([
   hmCloudClient.from('cars').select('*').order('created_at',{ascending:true}),
   hmCloudClient.from('car_expenses').select('*').order('created_at',{ascending:true}),
   hmCloudClient.from('clients').select('*').order('created_at',{ascending:true}),
   hmCloudClient.from('car_listings').select('*').order('created_at',{ascending:true}),
   hmCloudClient.from('car_history').select('*').order('event_date',{ascending:true}),
   hmCloudClient.from('car_photos').select('*').order('sort_order',{ascending:true})
  ]),10000);
  const bad=[cr,er,cl,li,hi,cp].find(x=>x.error); if(bad) throw bad.error;
  const carMap=new Map();
  db.cars=[]; db.expenses=[]; db.clients=[]; db.deals=[];
  (cr.data||[]).forEach(r=>{const id=localId();carMap.set(r.id,id);db.cars.push({id,cloudId:r.id,brand:r.brand,model:r.model,year:r.year||0,mileage:r.mileage||0,vin:r.vin||'',status:r.status,purchaseDate:r.purchase_date||'',ready:r.ready_date||'',purchase:+r.purchase_price||0,sale:+r.sale_price||0,note:r.note||'',photos:[],listings:[],history:[]});});
  (cp.data||[]).forEach(r=>{const c=db.cars.find(x=>x.cloudId===r.car_id);if(c){const path=r.storage_path||'';c.photos.push(path.startsWith('http')?path:`${SUPABASE_URL}/storage/v1/object/public/car-photos/${path}`);}});
  (er.data||[]).forEach(r=>{const c=db.cars.find(x=>x.cloudId===r.car_id);if(c)db.expenses.push({id:localId(),cloudId:r.id,carId:c.id,date:r.expense_date||'',category:r.category,amount:+r.amount||0,note:r.note||''});});
  (li.data||[]).forEach(r=>{const c=db.cars.find(x=>x.cloudId===r.car_id);if(c)c.listings.push({cloudId:r.id,site:r.platform,price:+r.price||0,url:r.url||''});});
  (hi.data||[]).forEach(r=>{const c=db.cars.find(x=>x.cloudId===r.car_id);if(c)c.history.push({date:(r.event_date||'').slice(0,10),text:r.description||r.event_type||''});});
  (cl.data||[]).forEach(r=>db.clients.push({id:localId(),cloudId:r.id,name:r.name,phone:r.phone||'',budget:+r.budget||0,status:r.status||'Новый',note:r.note||'',carIds:[]}));
  // client_cars is loaded separately because it depends on the generated local ids above.
  const cc=await hmCloudClient.from('client_cars').select('*'); if(cc.error)throw cc.error;
  (cc.data||[]).forEach(r=>{const cl=db.clients.find(x=>x.cloudId===r.client_id),c=db.cars.find(x=>x.cloudId===r.car_id);if(cl&&c)cl.carIds.push(c.id);});
  try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
  setCloudStatus(`☁️ Облако · ${db.cars.length} авто`,'ok'); page('dashboard'); return true;
 }catch(e){cloudErr('cloudLoad',e);return false;}
}
async function uploadPhotoData(carCloudId,dataUrl,index){
 const blob=await (await fetch(dataUrl)).blob();
 const path=`${carCloudId}/${Date.now()}_${index}.jpg`;
 const up=await hmCloudClient.storage.from('car-photos').upload(path,blob,{contentType:'image/jpeg',upsert:true});
 if(up.error)throw up.error; return path;
}
async function cloudUpsertCar(c){
 if(!cloudReady)return;
 const payload={brand:c.brand,model:c.model,year:c.year||null,mileage:c.mileage||null,vin:c.vin||null,status:c.status,purchase_date:c.purchaseDate||null,ready_date:c.ready||null,purchase_price:c.purchase||0,sale_price:c.sale||0,note:c.note||null};
 let row;
 if(c.cloudId){const r=await hmCloudClient.from('cars').update(payload).eq('id',c.cloudId).select().single();if(r.error)throw Object.assign(r.error,{_crmStep:'cars UPDATE'});row=r.data;}
 else {const r=await hmCloudClient.from('cars').insert(payload).select().single();if(r.error)throw Object.assign(r.error,{_crmStep:'cars INSERT'});row=r.data;c.cloudId=row.id;try{localStorage.setItem(KEY,JSON.stringify(db));}catch(_){} }
 // Replace listings. Check every request so sync can identify the exact failing table.
 {const r=await hmCloudClient.from('car_listings').delete().eq('car_id',c.cloudId);if(r.error)throw Object.assign(r.error,{_crmStep:'car_listings DELETE'});}
 if(c.listings?.length){const r=await hmCloudClient.from('car_listings').insert(c.listings.map(x=>({car_id:c.cloudId,platform:x.site,price:x.price||null,url:x.url||null})));if(r.error)throw Object.assign(r.error,{_crmStep:'car_listings INSERT'});}
 // Photos: upload current data URLs and rebuild photo rows. Existing public URLs are retained.
 {const r=await hmCloudClient.from('car_photos').delete().eq('car_id',c.cloudId);if(r.error)throw Object.assign(r.error,{_crmStep:'car_photos DELETE'});}
 const photoRows=[];
 for(let i=0;i<(c.photos||[]).length;i++){
   let path=c.photos[i];
   if(path.startsWith('data:')) {try{path=await uploadPhotoData(c.cloudId,c.photos[i],i);}catch(e){throw Object.assign(e,{_crmStep:'Storage car-photos UPLOAD'});}}
   else { const m=path.match(/car-photos\/([^?]+)(?:\?.*)?$/); if(m)path=m[1]; }
   photoRows.push({car_id:c.cloudId,storage_path:path,sort_order:i,is_cover:i===0});
 }
 if(photoRows.length){const r=await hmCloudClient.from('car_photos').insert(photoRows);if(r.error)throw Object.assign(r.error,{_crmStep:'car_photos INSERT'});}
 // Append current history to cloud when not already represented is intentionally omitted here; status/price changes are saved locally and can be pushed by sync later.
 return row;
}
async function cloudDeleteCar(c){
  if(!cloudReady || !hmCloudClient || !c?.cloudId) return;
  const carId=c.cloudId;
  // Remove files from Storage first; if Storage cleanup is blocked, continue with DB cleanup
  // so deleting the car never leaves the database record behind.
  try{
    const ph=await hmCloudClient.from('car_photos').select('storage_path').eq('car_id',carId);
    if(!ph.error){
      const paths=(ph.data||[]).map(x=>x.storage_path).filter(Boolean).map(x=>{
        const m=String(x).match(/car-photos\/(.+)$/); return m?m[1]:x;
      });
      if(paths.length){
        const sr=await hmCloudClient.storage.from('car-photos').remove(paths);
        if(sr.error) console.warn('Storage cleanup failed:',sr.error);
      }
    }
  }catch(e){ console.warn('Storage cleanup skipped:',e); }

  const steps=[
    ['car_listings','DELETE'],
    ['car_photos','DELETE'],
    ['car_expenses','DELETE'],
    ['car_history','DELETE'],
    ['tasks','DELETE']
  ];
  for(const [table,op] of steps){
    const r=await hmCloudClient.from(table).delete().eq('car_id',carId);
    if(r.error) throw Object.assign(r.error,{_crmStep:`${table} ${op}`});
  }
  // client_cars has a foreign key with ON DELETE CASCADE.
  const cr=await hmCloudClient.from('cars').delete().eq('id',carId);
  if(cr.error) throw Object.assign(cr.error,{_crmStep:'cars DELETE'});
}

async function cloudUpsertClient(cl){
 if(!cloudReady)return;
 const payload={name:cl.name,phone:cl.phone||null,email:cl.email||null,budget:cl.budget||null,status:cl.status||'Новый',note:cl.note||null};
 let row;
 if(cl.cloudId){const r=await hmCloudClient.from('clients').update(payload).eq('id',cl.cloudId).select().single();if(r.error)throw r.error;row=r.data;}
 else {const r=await hmCloudClient.from('clients').insert(payload).select().single();if(r.error)throw r.error;row=r.data;cl.cloudId=row.id;}
 await hmCloudClient.from('client_cars').delete().eq('client_id',cl.cloudId);
 const links=(cl.carIds||[]).map(id=>db.cars.find(c=>c.id==id)).filter(Boolean).map(c=>({client_id:cl.cloudId,car_id:c.cloudId})).filter(x=>x.car_id);
 if(links.length){const r=await hmCloudClient.from('client_cars').insert(links);if(r.error)throw r.error;}
}
async function cloudSync(){
 if(cloudBusy||!cloudReady)return;
 cloudBusy=true;setCloudStatus('☁️ Синхронизация…','warn');
 let step='';
 try{
  for(const c of db.cars){step=`Авто ${c.brand||''} ${c.model||''} → cars`;try{await cloudUpsertCar(c);try{localStorage.setItem(KEY,JSON.stringify(db));}catch(_){} }catch(e){throw Object.assign(e,{_crmStep:e._crmStep||step});}}
  for(const e of db.expenses){const c=db.cars.find(x=>x.id==e.carId);if(!c?.cloudId)continue;step='car_expenses '+(e.cloudId?'UPDATE':'INSERT');const payload={car_id:c.cloudId,category:e.category,amount:e.amount||0,expense_date:e.date||null,note:e.note||null}; if(e.cloudId){const r=await hmCloudClient.from('car_expenses').update(payload).eq('id',e.cloudId);if(r.error)throw Object.assign(r.error,{_crmStep:step});}else{const r=await hmCloudClient.from('car_expenses').insert(payload).select().single();if(r.error)throw Object.assign(r.error,{_crmStep:step});e.cloudId=r.data.id;}}
  for(const cl of db.clients){step=`clients ${cl.name||''}`;try{await cloudUpsertClient(cl);}catch(e){throw Object.assign(e,{_crmStep:e._crmStep||step});}}

async function compressImage(file,maxSize=1600,quality=0.78){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onerror=reject;
   reader.onload=()=>{
     const img=new Image();
     img.onerror=reject;
     img.onload=()=>{
       let w=img.naturalWidth,h=img.naturalHeight;
       const scale=Math.min(1,maxSize/Math.max(w,h));
       w=Math.max(1,Math.round(w*scale));
       h=Math.max(1,Math.round(h*scale));
       const canvas=document.createElement('canvas');
       canvas.width=w; canvas.height=h;
       const ctx=canvas.getContext('2d');
       ctx.drawImage(img,0,0,w,h);
       resolve(canvas.toDataURL('image/jpeg',quality));
     };
     img.src=reader.result;
   };
   reader.readAsDataURL(file);
 });
}

  <h3>Объявления</h3>${listings.map(x=>`<div class="listing"><b>${esc(x.site||'Площадка')}</b> ${x.price?`· ${euro(x.price)}`:''}${x.url?`<br><a href="${esc(x.url)}" target="_blank" rel="noopener">Открыть ↗</a>`:''}</div>`).join('')||'<div class="muted">Площадки не добавлены.</div>'}
  <h3>Клиенты (${clients.length})</h3>
  ${clients.map(cl=>`<div class="row"><span><b>${esc(cl.name)}</b><br><small>${esc(cl.phone||'')} · ${esc(cl.status||'Новый')}</small></span><div><b>${euro(cl.budget)}</b><br><button class="btn secondary" onclick="openClient(${id},${cl.id})">Изменить</button></div></div>`).join('')||'<div class="muted">К этому авто пока нет клиентов.</div>'}
  <button class="btn secondary" style="margin-top:8px" onclick="openClient(${id},null)">+ Добавить клиента к этому авто</button>
  <h3>Расходы</h3>${ex.map(e=>`<div class="row"><span>${esc(e.category)}<br><small>${esc(e.date||'')}</small></span><b>${euro(e.amount)}</b></div>`).join('')||'<div class="muted">Расходов нет.</div>'}
  ${c.note?`<h3>Комментарий</h3><div class="muted" style="white-space:pre-wrap">${esc(c.note)}</div>`:''}
 </div></div>`;
}
async function deleteCar(id){
 const c=db.cars.find(x=>x.id===id);
 if(!c)return;
 const title=`${c.brand||''} ${c.model||''}`.trim()||'этот автомобиль';
 const ok=confirm(`Удалить автомобиль «${title}»?\\n\\nБудут удалены его расходы, объявления, история и фотографии.\\n\\nЭто действие нельзя отменить.`);
 if(!ok)return;
 const btns=[...document.querySelectorAll('button')];
 const btn=btns.find(b=>b.classList.contains('dangerBtn'));
 if(btn){btn.disabled=true;btn.textContent='Удаляем…';}
 try{
   if(cloudReady && c.cloudId){
     try{
       await cloudDeleteCar(c);
     }catch(err){
       console.error('deleteCar cloud',err);
       alert('Автомобиль не удалён из облака.\\n\\nШаг: '+(err._crmStep||'неизвестно')+'\\nОшибка: '+(err.message||err));
       return;
     }
   }
   db.cars=db.cars.filter(x=>x.id!==id);
   db.expenses=db.expenses.filter(x=>x.carId!==id);
   db.clients.forEach(cl=>{if(Array.isArray(cl.carIds))cl.carIds=cl.carIds.filter(x=>String(x)!==String(id));});
   db.deals=db.deals.filter(d=>String(d.carId)!==String(id));
   save();
   closeModal();
   page('cars');
   setCloudStatus(cloudReady?'☁️ Авто удалено из облака':'☁️ Авто удалено локально','ok');
 }catch(err){
   console.error(err);
   alert('Не удалось удалить автомобиль.');
 }finally{
   if(btn){btn.disabled=false;btn.textContent='Удалить авто';}
 }
}

function openExpense(carId){
 modalbox.innerHTML=`<h2>Добавить расход</h2><div class="formgrid"><label>Дата<input class="input" id="edate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Категория<select id="ecat"><option>Доставка</option><option>Таможня</option><option>Ремонт</option><option>Детейлинг</option><option>Документы</option><option>Реклама</option><option>Прочее</option></select></label><label>Сумма<input class="input" id="eamount" type="number"></label><label>Комментарий<input class="input" id="enote"></label></div><div style="margin-top:18px;text-align:right"><button class="btn secondary" onclick="closeModal()">Отмена</button> <button class="btn" onclick="saveExpense(${carId})">Сохранить</button></div>`;
 modal.classList.add('open');
}
async function saveExpense(carId){const e={id:Date.now(),carId,date:edate.value,category:ecat.value,amount:+eamount.value,note:enote.value};db.expenses.push(e);save();if(cloudReady){try{const c=db.cars.find(x=>x.id==carId);if(c?.cloudId){const r=await hmCloudClient.from('car_expenses').insert({car_id:c.cloudId,category:e.category,amount:e.amount||0,expense_date:e.date||null,note:e.note||null}).select().single();if(r.error)throw r.error;e.cloudId=r.data.id;}}catch(err){console.error(err);setCloudStatus('☁️ Расход сохранён локально','warn')}}closeModal();viewCar(carId)}
function closeModal(){modal.classList.remove('open')}

function openClient(carId=null, clientId=null){
 const c=clientId?db.clients.find(x=>x.id===clientId):{};
 const selected=clientId?(c.carIds||[]):(carId?[carId]:[]);
 modalbox.innerHTML=`<h2>${clientId?'Редактировать клиента':'Новый клиент'}</h2>
 <div class="clientModalGrid">
  <label>Имя клиента<input class="input" id="clName" value="${esc(c.name||'')}"></label>
  <label>Телефон<input class="input" id="clPhone" value="${esc(c.phone||'')}"></label>
  <label>Бюджет<input class="input" id="clBudget" type="number" value="${c.budget||''}"></label>
  <label>Статус<select id="clStatus"><option>Новый</option><option>Контакт</option><option>Интересуется</option><option>Просмотр</option><option>Торг</option><option>Продано</option><option>Отказ</option></select></label>
  <label class="full">Комментарий<textarea class="input" id="clNote">${esc(c.note||'')}</textarea></label>
  <div class="full"><b>Интересующие автомобили</b><div class="clientCarList">
   ${db.cars.map(car=>`<label class="clientCarOption"><input type="checkbox" class="clCar" value="${car.id}" ${selected.map(String).includes(String(car.id))?'checked':''}> <span>${esc(car.brand)} ${esc(car.model)} · ${euro(car.sale)}</span></label>`).join('')||'<div class="muted">Автомобилей пока нет.</div>'}
  </div></div>
 </div>
 <div style="margin-top:18px;display:flex;justify-content:flex-end;gap:10px">
  <button type="button" class="btn secondary" onclick="closeModal()">Отмена</button>
  <button type="button" class="btn" onclick="saveClient(${clientId||'null'})">Сохранить клиента</button>
 </div>`;
 clStatus.value=c.status||'Новый';
 modal.classList.add('open');
}
async function saveClient(clientId=null){
 const name=(document.getElementById('clName')?.value||'').trim();
 if(!name){alert('Укажите имя клиента');return;}
 const data={
  id:clientId||Date.now(),
  name,
  phone:(document.getElementById('clPhone')?.value||'').trim(),
  budget:+(document.getElementById('clBudget')?.value||0),
  status:document.getElementById('clStatus')?.value||'Новый',
  note:(document.getElementById('clNote')?.value||'').trim(),
  carIds:[...document.querySelectorAll('.clCar:checked')].map(x=>Number(x.value))
 };
 const i=db.clients.findIndex(x=>x.id===data.id);
 if(i>=0)db.clients[i]=data;else db.clients.push(data);
 save();
 if(cloudReady){try{await cloudUpsertClient(data);save();setCloudStatus('☁️ Клиент сохранён в облако','ok');}catch(err){console.error(err);setCloudStatus('☁️ Клиент сохранён локально','warn')}}
 closeModal();
 clients();
}

function clients(){
 app.innerHTML=`<div class="top"><h1>Клиенты</h1><button class="btn" onclick="addClient()">+ Новый клиент</button></div>
 <div class="stat"><table style="width:100%;border-collapse:collapse"><tr><th align=left>Имя</th><th align=left>Телефон</th><th align=left>Бюджет</th><th align=left>Интерес</th><th align=left>Статус</th><th></th></tr>
 ${db.clients.map(c=>{
   const cars=(c.carIds||[]).map(id=>db.cars.find(x=>x.id===id)).filter(Boolean);
   const names=cars.map(x=>x.brand+' '+x.model).join(', ');
   return `<tr><td style="padding:12px 0"><b>${esc(c.name)}</b>${c.note?`<br><small>${esc(c.note)}</small>`:''}</td><td>${esc(c.phone||'—')}</td><td>${euro(c.budget)}</td><td>${esc(names||'—')}</td><td>${esc(c.status||'Новый')}</td><td><button class="btn secondary" onclick="openClient(null,${c.id})">Изменить</button></td></tr>`;
 }).join('')||'<tr><td colspan=6 class="empty">Клиентов пока нет.</td></tr>'}</table></div>`;
}
function addClient(carId=null){ openClient(carId,null); }
function deals(){
 app.innerHTML=`<div class="top"><h1>Сделки</h1></div><div class="cars">${['Переговоры','Резерв','Предоплата','Продано'].map(s=>`<div class="stat"><h3>${s}</h3>${db.deals.filter(d=>d.status===s).map(d=>{let c=db.cars.find(x=>x.id===d.carId),cl=db.clients.find(x=>x.id===d.clientId);return `<div class="row"><span>${esc(cl?.name||'Клиент')}<br>${esc(c?.brand||'')} ${esc(c?.model||'')}</span><b>${euro(d.price)}</b></div>`}).join('')||'<div class="muted">Нет сделок</div>'}</div>`).join('')}</div>`;
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));
modal.onclick=e=>{if(e.target===modal)closeModal()};

db.cars.forEach(c=>{
 if(!Array.isArray(c.listings))c.listings=[];
 if(!Array.isArray(c.history))c.history=[];
 if(!Array.isArray(c.photos))c.photos=[];
});
page('dashboard');
cloudInit();
setTimeout(async()=>{
  if(!cloudReady)return;
  const hadLocal=db.cars.length||db.clients.length||db.expenses.length;
  if(hadLocal){
    setCloudStatus('☁️ Локальные данные · облако проверяется…','warn');
    cloudPing();
  }else{
    setCloudStatus('☁️ Подключение к облаку…','warn');
    const ok=await cloudLoad();
    if(!ok)setCloudStatus('☁️ Локальный режим · облако недоступно','warn');
  }
},50);
</script>
</body></html>
