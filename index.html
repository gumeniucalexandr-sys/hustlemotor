<script>

const SUPABASE_URL = 'https://jpzoghmpfdhyzisjtpza.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_FP-wtxNOIFPOKj7d4Rk8fA_4BkeP_UM';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let cloudReady=false;
let cloudBusy=false;

function normalizeCar(row, photosRows=[]){
  const pics=photosRows.filter(x=>String(x.car_id)===String(row.id)).sort((a,b)=>a.sort_order-b.sort_order)
    .map(x=>x.public_url||'').filter(Boolean);
  return {
    id:row.id, brand:row.brand||'', model:row.model||'', year:row.year||0, mileage:row.mileage||0,
    vin:row.vin||'', status:row.status||'В продаже', purchaseDate:row.purchase_date||'', ready:row.ready_date||'',
    purchase:+row.purchase_price||0, sale:+row.sale_price||0, note:row.note||'', photos:pics,
    listings:[], history:[]
  };
}

async function loadCloud(){
  const [carsR,photosR,expR,clientsR,linksR,listingsR,historyR,dealsR]=await Promise.all([
    supabase.from('cars').select('*').order('created_at',{ascending:false}),
    supabase.from('car_photos').select('*').order('sort_order'),
    supabase.from('car_expenses').select('*').order('expense_date',{ascending:false}),
    supabase.from('clients').select('*').order('created_at',{ascending:false}),
    supabase.from('client_cars').select('*'),
    supabase.from('car_listings').select('*').order('created_at',{ascending:false}),
    supabase.from('car_history').select('*').order('event_date',{ascending:true}),
    supabase.from('deals').select('*').order('created_at',{ascending:false})
  ]);
  for(const r of [carsR,photosR,expR,clientsR,linksR,listingsR,historyR,dealsR]){
    if(r.error) throw r.error;
  }
  const publicUrl=(path)=>{
    if(!path)return '';
    return supabase.storage.from('car-photos').getPublicUrl(path).data.publicUrl;
  };
  const photoRows=photosR.data.map(x=>({...x,public_url:publicUrl(x.storage_path)}));
  db.cars=carsR.data.map(c=>{
    const x=normalizeCar(c,photoRows);
    x.listings=listingsR.data.filter(l=>String(l.car_id)===String(c.id)).map(l=>({id:l.id,site:l.platform,price:+l.price||0,url:l.url||'',publishedAt:l.published_at||''}));
    x.history=historyR.data.filter(h=>String(h.car_id)===String(c.id)).map(h=>({id:h.id,date:(h.event_date||'').slice(0,10),text:h.description,type:h.event_type}));
    return x;
  });
  db.expenses=expR.data.map(e=>({id:e.id,carId:e.car_id,date:e.expense_date,category:e.category,amount:+e.amount||0,note:e.note||''}));
  db.clients=clientsR.data.map(c=>({
    id:c.id,name:c.name,phone:c.phone||'',email:c.email||'',budget:+c.budget||0,status:c.status||'Новый',note:c.note||'',
    carIds:linksR.data.filter(x=>String(x.client_id)===String(c.id)).map(x=>x.car_id)
  }));
  db.deals=dealsR.data.map(d=>({id:d.id,carId:d.car_id,clientId:d.client_id,price:+d.sale_price||0,saleDate:d.sale_date,status:d.status,note:d.note||''}));
  cloudReady=true;
  const s=document.getElementById('cloudStatus');if(s){s.textContent='☁ Supabase подключён';s.style.background='#166534';}
  return true;
}

async function uploadDataUrl(dataUrl, path){
  const res=await fetch(dataUrl);
  const blob=await res.blob();
  const {error}=await supabase.storage.from('car-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(error) throw error;
  return path;
}

async function replaceCarPhotos(carId, dataUrls){
  const {data:old,error:oldErr}=await supabase.from('car_photos').select('id,storage_path').eq('car_id',carId);
  if(oldErr) throw oldErr;
  if(old?.length){
    await supabase.storage.from('car-photos').remove(old.map(x=>x.storage_path));
    const {error}=await supabase.from('car_photos').delete().eq('car_id',carId);
    if(error) throw error;
  }
  const urls=[];
  for(let i=0;i<dataUrls.length;i++){
    const src=dataUrls[i];
    if(!src) continue;
    let path;
    if(src.startsWith('http')) {
      const m=src.match(/car-photos\/([^?]+)(?:\?.*)?$/);
      path=m?decodeURIComponent(m[1]):null;
    } else {
      path=carId+'/'+Date.now()+'_'+i+'.jpg';
      await uploadDataUrl(src,path);
    }
    if(path){
      const {error}=await supabase.from('car_photos').insert({car_id:carId,storage_path:path,sort_order:i,is_cover:i===0});
      if(error) throw error;
      urls.push(supabase.storage.from('car-photos').getPublicUrl(path).data.publicUrl);
    }
  }
  return urls;
}

async function saveCarCloud(c){
  let carId=c.id;
  const payload={
    brand:c.brand,model:c.model,year:c.year||null,mileage:c.mileage||null,vin:c.vin||null,status:c.status||'В продаже',
    purchase_date:c.purchaseDate||null,ready_date:c.ready||null,purchase_price:c.purchase||0,sale_price:c.sale||0,note:c.note||null
  };
  if(carId){
    const {error}=await supabase.from('cars').update(payload).eq('id',carId);
    if(error) throw error;
  }else{
    const {data,error}=await supabase.from('cars').insert(payload).select().single();
    if(error) throw error;
    carId=data.id;
  }
  await replaceCarPhotos(carId,c.photos||[]);
  const {error:delL}=await supabase.from('car_listings').delete().eq('car_id',carId);
  if(delL) throw delL;
  if(c.listings?.length){
    const rows=c.listings.map(l=>({car_id:carId,platform:l.site||'Площадка',price:l.price||null,url:l.url||null,published_at:l.publishedAt||null}));
    const {error}=await supabase.from('car_listings').insert(rows);
    if(error) throw error;
  }
  if(!c.id){
    const {error}=await supabase.from('car_history').insert({car_id:carId,event_type:'created',description:'Автомобиль добавлен'});
    if(error) throw error;
  }
  return carId;
}

async function saveClientCloud(c){
  let id=c.id;
  const payload={name:c.name,phone:c.phone||null,email:c.email||null,budget:c.budget||null,status:c.status||'Новый',note:c.note||null};
  if(id){
    const {error}=await supabase.from('clients').update(payload).eq('id',id);
    if(error) throw error;
  }else{
    const {data,error}=await supabase.from('clients').insert(payload).select().single();
    if(error) throw error;
    id=data.id;
  }
  const {error:del}=await supabase.from('client_cars').delete().eq('client_id',id);
  if(del) throw del;
  if(c.carIds?.length){
    const {error}=await supabase.from('client_cars').insert(c.carIds.map(car_id=>({client_id:id,car_id})));
    if(error) throw error;
  }
  return id;
}

async function saveExpenseCloud(e){
  const {data,error}=await supabase.from('car_expenses').insert({
    car_id:e.carId,expense_date:e.date||null,category:e.category,amount:e.amount||0,note:e.note||null
  }).select().single();
  if(error) throw error;
  return data;
}

async function refreshCloud(){
  await loadCloud();
  page('cars');
}

async function initCloud(){
  try{
    await loadCloud();
    page('dashboard');
  }catch(err){
    console.error('Supabase init error:',err);
    cloudReady=false;
    const s=document.getElementById('cloudStatus');if(s){s.textContent='⚠ Нет соединения';s.style.background='#b91c1c';}
    alert('Не удалось подключиться к Supabase: '+(err.message||err));
    page('dashboard');
  }
}
const KEY='abuv_auto_crm_v1';
let db;
try{
  db=JSON.parse(localStorage.getItem(KEY)||'{"cars":[],"clients":[],"deals":[],"expenses":[]}');
}catch(e){
  db={cars:[],clients:[],deals:[],expenses:[]};
}
db.cars=Array.isArray(db.cars)?db.cars:[];
db.clients=Array.isArray(db.clients)?db.clients:[];
db.deals=Array.isArray(db.deals)?db.deals:[];
db.expenses=Array.isArray(db.expenses)?db.expenses:[];
db.cars.forEach(c=>{
  if(!Array.isArray(c.photos))c.photos=[];
  if(!Array.isArray(c.listings))c.listings=[];
  if(!Array.isArray(c.history))c.history=[];
});
let photos=[]; let editId=null;
const save=()=>{
  try{
    localStorage.setItem(KEY,JSON.stringify(db));
    return true;
  }catch(e){
    console.error('Storage quota:',e);
    return false;
  }
};
const euro=n=>'€'+Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function page(name){
 document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===name));
 if(name==='dashboard') dashboard(); else if(name==='cars') cars(); else if(name==='clients') clients(); else deals();
}
function dashboard(){
 const active=db.cars.filter(c=>c.status!=='Продана'), sold=db.cars.filter(c=>c.status==='Продана');
 const invested=active.reduce((s,c)=>s+cost(c),0);
 const potential=active.reduce((s,c)=>s+(+c.sale||0)-cost(c),0);
 const profit=sold.reduce((s,c)=>s+(+c.sale||0)-cost(c),0);
 const avgDays=active.length?Math.round(active.reduce((s,c)=>s+days(c),0)/active.length):0;
 const attention=active.filter(c=>days(c)>60).sort((a,b)=>days(b)-days(a)).slice(0,8);
 app.innerHTML=`<div class="top"><h1>Dashboard</h1><button class="btn" onclick="openCar()">+ Добавить авто</button></div>
 <div class="statGrid">
  <div class="kpi"><div class="label">🚗 В наличии</div><div class="value">${active.length}</div></div>
  <div class="kpi"><div class="label">💰 Вложено</div><div class="value">${euro(invested)}</div></div>
  <div class="kpi"><div class="label">📈 Потенциальная прибыль</div><div class="value">${euro(potential)}</div></div>
  <div class="kpi"><div class="label">⏱ Средний срок</div><div class="value">${avgDays} дн.</div></div>
 </div>
 <div style="height:14px"></div>
 <div class="statGrid">
  <div class="kpi"><div class="label">💵 Прибыль с проданных</div><div class="value">${euro(profit)}</div></div>
  <div class="kpi"><div class="label">✅ Продано</div><div class="value">${sold.length}</div></div>
  <div class="kpi"><div class="label">🔧 В расходах</div><div class="value">${euro(db.expenses.reduce((s,e)=>s+(+e.amount||0),0))}</div></div>
  <div class="kpi"><div class="label">👤 Клиенты</div><div class="value">${db.clients.length}</div></div>
 </div>
 <div style="height:18px"></div>
 <div class="stat"><h3>⚠️ Автомобили, требующие внимания</h3>
 ${attention.map(c=>`<div class="row" style="cursor:pointer" onclick="viewCar(${c.id})"><span>${esc(c.brand)} ${esc(c.model)}<br><small>${euro(c.sale)} · прибыль ${euro((+c.sale||0)-cost(c))}</small></span><b class="${days(c)>90?'danger':''}">${days(c)} дней</b></div>`).join('')||'<div class="muted">Пока нет машин старше 60 дней.</div>'}
 </div>`;
}
function cost(c){return (+c.purchase||0)+db.expenses.filter(e=>e.carId==c.id).reduce((s,e)=>s+(+e.amount||0),0)}
function days(c){
 const start=c.ready||c.purchaseDate;
 if(!start)return 0;
 const d=Math.floor((Date.now()-new Date(start))/86400000);
 return Math.max(0,d);
}
function ageClass(c){
 const d=days(c);
 return d>60?'bad':d>30?'warn':'good';
}
function cars(){
 app.innerHTML=`<div class="top"><h1>Автомобили</h1><button class="btn" onclick="openCar()">+ Добавить авто</button></div>
 <div class="toolbar">
  <input class="input" id="search" placeholder="Поиск: BMW, VIN, модель..." oninput="renderCars()">
  <select id="filter" onchange="renderCars()"><option>Все</option><option>В продаже</option><option>Резерв</option><option>Продана</option><option>Не готова</option></select>

async function compressImage(file,maxSize=1600,quality=0.78){
 return new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onerror=reject;
   reader.onload=()=>{
     const img=new Image();
     img.onerror=reject;
     img.onload=()=>{
       let w=img.naturalWidth,h=img.naturalHeight;
       const scale=Math.min(1,maxSize/Math.max(w,h));
       w=Math.max(1,Math.round(w*scale));
       h=Math.max(1,Math.round(h*scale));
       const canvas=document.createElement('canvas');
       canvas.width=w; canvas.height=h;
       const ctx=canvas.getContext('2d');
       ctx.drawImage(img,0,0,w,h);
       resolve(canvas.toDataURL('image/jpeg',quality));
     };
     img.src=reader.result;
   };
   reader.readAsDataURL(file);
 });
}

   wrap.addEventListener('dragstart',e=>{wrap.classList.add('dragging');e.dataTransfer.setData('text/plain',i)});
